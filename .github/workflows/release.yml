name: Release

# Publishing is bound to a tag, not a branch push: a `v*` tag whose version
# matches package.json is the only thing that reaches npm.
on:
    push:
        tags:
            - 'v*'

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write # create the GitHub release
            id-token: write # OIDC token for npm trusted publishing

        steps:
            - name: Check out
              uses: actions/checkout@v5

            - name: Set up Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org

            # npm 11.5.1+ is required for trusted publishing (OIDC).
            - name: Update npm
              run: npm install -g npm@latest

            - name: Install
              run: npm ci

            - name: Verify tag matches package.json
              run: |
                  tag="${GITHUB_REF_NAME#v}"
                  pkg="$(node -p "require('./package.json').version")"
                  if [ "$tag" != "$pkg" ]; then
                      echo "::error::tag $GITHUB_REF_NAME does not match package.json $pkg"
                      exit 1
                  fi
                  echo "releasing $pkg"

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build

            # Guard against a build that silently produces nothing: the bundle
            # is what users load, and it must carry the inlined catalog and a
            # fully described config schema.
            - name: Verify build output
              run: node scripts/verify.mjs

            # Trusted publishing: no NPM_TOKEN secret. npm exchanges the OIDC
            # token for short-lived credentials, and provenance is attached
            # automatically.
            - name: Publish
              run: npm publish --provenance --access public

            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  body: |
                      Install: `npm install koishi-plugin-chatluna-unified-adapter@${{ github.ref_name }}`