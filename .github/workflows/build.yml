name: Build

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    verify:
        runs-on: ubuntu-latest

        steps:
            - name: Check out
              uses: actions/checkout@v5

            - name: Set up Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - name: Install
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build

            # A clean checkout must produce a bundle that carries the inlined
            # catalog and a fully described config schema.
            - name: Verify build output
              run: node scripts/verify.mjs